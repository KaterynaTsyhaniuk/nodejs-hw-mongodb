tags:
  - Auth
summary: User registration
description: 'Create a new user account'
operationId: registerUser
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/user.yaml'
responses:
  '201':
    description: 'Successfully registered a user!'
    content:
      application/json:
        schema:
          type: object
          properties:
            user:
              $ref: '../../components/schemas/user.yaml'
            session:
              $ref: '../../components/schemas/session.yaml'
  '409':
    description: 'Email in use.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Email in use.'
