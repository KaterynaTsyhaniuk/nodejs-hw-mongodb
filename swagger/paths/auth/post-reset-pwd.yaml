tags:
  - Auth
summary: Reset user password
description: Resets the user's password using a valid reset token.
operationId: resetPasswordUser
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
            description: 'Password reset token'
            example: 'c29tZV9yYW5kb21fcmVmcnVzaF90b2tlbg...'
          newPassword:
            type: string
            format: password
            description: 'New password for the user'
            example: '0987654321'
responses:
  '200':
    description: 'Password has been successfully reset.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent.'
            data:
              type: object
              example: {}
  '401':
    description: Unauthorized. Token is expired or invalid.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: 'Token is expired or invalid.'
  '404':
    description: Not found. The requested resource does not exist.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: 'User not found.'
