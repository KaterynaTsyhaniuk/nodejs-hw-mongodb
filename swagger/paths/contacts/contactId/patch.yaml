tags:
  - Contacts
summary: Update a contact
operationId: updateContact
description: Update specific fields of a contact.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: The ID of the contact to update.
    example: 67b48696cc06b0dc1df8984b
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: The new name of the contact.
            example: 'Kateryna Tsyhaniuk'
          phoneNumber:
            type: string
            description: The new phone number.
            example: '+380987654321'
          email:
            type: string
            format: email
            description: The new email address.
            example: 'katerynatsyhaniuk@gmail.com'
          isFavourite:
            type: boolean
            description: Whether is contact favorite new.
            example: true
          contactType:
            description: "Contact's type contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          photo:
            type: string
            format: binary
            description: Optional contact photo
responses:
  '200':
    description: Contact updated successfully.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contact updated successfully'
            data:
              $ref: ../../../components/schemas/contact.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
