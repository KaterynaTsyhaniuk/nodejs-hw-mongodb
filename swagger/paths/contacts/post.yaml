tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Keteryna Tsyhaniuk'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380987678987'
          email:
            description: "Contact's email"
            type: string
            example: 'kyzkakatryska@gmail.com'
          isFavourite:
            description: 'Whether is contact favorite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type contact"
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Create a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
