tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact'
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact name (required).
            example: 'Kateryna Tsyhaniuk'
          phoneNumber:
            type: string
            minLength: 3
            maxLength: 20
            description: Contact phone number (required).
            example: '+380987654321'
          email:
            type: string
            minLength: 3
            maxLength: 20
            format: email
            description: Contact email (required).
            example: 'katerynatsyhaniuk@gmail.com'
          isFavourite:
            type: boolean
            description: Is the contact a favorite?.
            example: true
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: Contact type.
            example: 'work'
          userId:
            type: string
            description: Valid MongoDB user ID.
            example: '6557a3c2b1f3b1a4d1f8e123'
          photo:
            type: string
            format: binary
            description: Contact photo.

responses:
  '201':
    description: 'Successfully created a contact!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
