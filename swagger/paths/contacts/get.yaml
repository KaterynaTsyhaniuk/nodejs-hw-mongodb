tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Get all contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    description: The page number for pagination
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        ['_id', 'name', 'email', 'contactType', 'isFavourite', 'phoneNumber']
    example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
    example: 'asc'

responses:
  '200':
    description: 'Contacts received successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contacts received successfully'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
