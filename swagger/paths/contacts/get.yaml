tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Get all contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
    description: The page number for pagination
    example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      maximum: 100
    description: Number of contacts per page
    example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      enum:
        ['_id', 'name', 'email', 'contactType', 'isFavourite', 'phoneNumber']
    description: Field to sort by
    example: 'name'
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
    description: Sorting order (ascending or descending)
    example: 'asc'
  - in: query
    name: name
    schema:
      type: string
    description: Filter contacts by name.
    example: 'Kateryna Tsyhaniuk'
  - in: query
    name: email
    schema:
      type: string
      format: email
    description: Filter contacts by email.
    example: 'katerynatsyhaniuk.com'
  - in: query
    name: phoneNumber
    schema:
      type: string
    description: Filter contacts by phone number.
    example: '+380987678987'
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by favorite status.
    example: true
  - in: query
    name: contactType
    schema:
      type: string
      enum: ['work', 'home', 'personal']
    description: Filter contacts by type.
    example: work

responses:
  '200':
    description: 'Contacts received successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contacts received successfully'
            data:
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
