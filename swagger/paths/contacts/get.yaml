tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: 'Get all contacts'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      minimum: 1
      example: 1
      description: The page number for pagination
  - in: query
    name: perPage
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      example: 10
      description: The number of contacts per page
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      enum:
        ['_id', 'name', 'email', 'contactType', 'isFavourite', 'phoneNumber']
      example: 'name'
      description: The field to sort by
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
      description: The sorting order (ascending or descending)

responses:
  '200':
    description: 'Contacts received successfully'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Contacts received successfully'
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
