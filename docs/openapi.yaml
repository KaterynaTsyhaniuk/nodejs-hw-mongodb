openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of Contacts app
tags:
  - name: Contacts
    description: Operation about contacts.
  - name: Auth
    description: Auth operations.
  # теги, що ви будете використовувати
servers:
  - url: http://localhost:3000
  # - url: #посилання на задеплоєний сайт
paths:
  /contacts:
    post:
      $ref: ../swagger/paths/contacts/post.yaml
    get:
      $ref: ../swagger/paths/contacts/get.yaml

  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/contactId/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/contactId/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/contactId/delete.yaml

  /auth/register:
    post:
      $ref: ../swagger/paths/auth/post.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auth/post-login.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auth/post-refresh.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auth/post-logout.yaml
  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auth/post-send-reset-email.yaml
  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auth/post-reset-pwd.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
